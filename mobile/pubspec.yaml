name: cropai_mobile
description: CropAI farmer app — the Android companion of the CropAI web platform (same backend, same AgriSmart model, same Mitra assistant).
publish_to: 'none'

# versionName+versionCode. Bump the build number for every APK you hand out.
version: 1.0.0+1

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # state + navigation
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4

  # networking + storage (one Dio client; tokens only in secure storage)
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  connectivity_plus: ^7.3.1 # 7.3.2 conflicts with geolocator via the Linux-only dbus package

  # device features
  image_picker: ^1.2.4
  # 11.x: required by vapi 0.1.0 / daily_flutter 0.31 (^11.3.1)
  permission_handler: ^11.4.0
  geolocator: ^14.1.2
  flutter_tts: ^4.2.5
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  package_info_plus: ^10.2.2

  # Mitra voice (Vapi Flutter SDK; uses Daily for mobile audio)
  vapi: ^0.1.0

  # charts (forecast); score bars and gauge are custom painters
  # Material widgets now ship as a package (flutter/material.dart is deprecated since 3.47)
  material_ui: ^1.11.0
  cupertino_ui: ^1.1.6
  fl_chart: ^1.3.1
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
